    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2128;
      --border: #21262d;
      --accent: #f778ba;
      --purple: #9f86e8;
      --green: #8fb35a;
      --text: #e6edf3;
      --muted: #8b949e;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans JP', 'Hiragino Sans', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: 72px; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.75; }
    a { color: inherit; text-decoration: none; }

    /* ── LANGUAGE BAR ── */
    .lang-bar {
      position: sticky; top: 0; z-index: 10;
      display: flex; justify-content: center; flex-wrap: wrap; gap: 8px;
      padding: 12px 16px;
      background: rgba(13,17,23,.88);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .lang-btn {
      font-family: var(--sans); font-size: .8rem;
      padding: 5px 12px; border-radius: 20px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--muted); cursor: pointer;
      transition: border-color .2s, color .2s, background .2s;
    }
    .lang-btn:hover { color: var(--text); border-color: var(--accent); }
    .lang-btn.active { color: #0d1117; background: var(--accent); border-color: var(--accent); font-weight: 600; }

    /* ── HERO ── */
    .hero {
      text-align: center; padding: 72px 24px 56px; position: relative; overflow: hidden;
      background: radial-gradient(ellipse 60% 50% at 50% -10%, rgba(247,119,186,.16) 0%, transparent 70%);
    }
    .hero-icon {
      width: 96px; height: 96px; border-radius: 22px; display: block; margin: 0 auto 20px;
      border: 1px solid var(--border); box-shadow: 0 8px 32px rgba(247,119,186,.18);
    }
    .hero h1 { font-family: var(--mono); font-size: clamp(2rem, 5vw, 3rem); font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
    .hero .sub { margin-top: 12px; font-size: 1.1rem; color: var(--accent); font-weight: 600; }
    .hero .desc { margin: 18px auto 0; max-width: 560px; color: var(--muted); font-size: .95rem; font-weight: 300; }
    .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 28px; }
    .chip {
      font-family: var(--mono); font-size: .75rem; padding: 6px 14px; border-radius: 20px;
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      transition: border-color .2s, color .2s;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .btn-play {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 32px;
      padding: 12px 24px; border-radius: 8px; background: var(--accent); color: #0d1117;
      font-family: var(--mono); font-size: .85rem; font-weight: 600; letter-spacing: .04em;
      transition: opacity .2s, transform .2s;
    }
    .btn-play:hover { opacity: .85; transform: translateY(-2px); }

    /* ── FEATURE SECTIONS ── */
    .feature { padding: 64px 24px; }
    .feature:nth-of-type(even) { background: var(--surface); }
    .feature-inner {
      max-width: 880px; margin: 0 auto;
      display: flex; align-items: center; justify-content: center; gap: 56px;
    }
    .feature:nth-of-type(even) .feature-inner { flex-direction: row-reverse; }
    .shot { flex: 0 0 auto; width: 280px; }
    .shot img {
      width: 100%; height: auto; display: block; border-radius: 22px;
      border: 1px solid var(--border); box-shadow: 0 16px 48px rgba(0,0,0,.5);
    }
    .feature-text { flex: 1; min-width: 0; }
    .label { font-family: var(--mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
    .feature-text h2 { font-family: var(--mono); font-size: 1.5rem; font-weight: 600; line-height: 1.3; margin: 6px 0 4px; }
    .feature-text .tagline { color: var(--muted); font-size: .95rem; margin-bottom: 18px; }
    .feature-text ul { list-style: none; display: grid; gap: 10px; }
    .feature-text li {
      position: relative; padding: 12px 14px 12px 40px; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--border); font-size: .9rem; color: #c9d1d9;
    }
    .feature:nth-of-type(even) .feature-text li { background: var(--surface2); }
    .feature-text li::before {
      content: ''; position: absolute; left: 16px; top: 21px; width: 10px; height: 10px; border-radius: 50%;
      background: var(--dot, var(--accent));
    }
    .feature:nth-of-type(odd) { --dot: var(--purple); }
    .feature:nth-of-type(even) { --dot: var(--green); }

    /* ── WHY GRID ── */
    .why { padding: 72px 24px; max-width: 880px; margin: 0 auto; text-align: center; }
    .why h2 { font-family: var(--mono); font-size: 1.5rem; font-weight: 600; margin-bottom: 32px; }
    .why-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; text-align: left; }
    .why-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px;
      transition: border-color .2s, transform .2s;
    }
    .why-card:hover { border-color: var(--accent); transform: translateY(-3px); }
    .why-card .emoji { font-size: 1.6rem; }
    .why-card h3 { font-family: var(--mono); font-size: .95rem; font-weight: 600; margin: 8px 0 4px; }
    .why-card p { font-size: .85rem; color: var(--muted); line-height: 1.6; }

    /* ── FOOTER ── */
    footer {
      text-align: center; padding: 32px 24px 48px; border-top: 1px solid var(--border);
      font-family: var(--mono); font-size: .75rem; color: var(--muted);
    }
    footer a { color: var(--accent); }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 720px) {
      .feature { padding: 48px 20px; }
      .feature-inner, .feature:nth-of-type(even) .feature-inner { flex-direction: column; gap: 28px; }
      .shot { width: min(260px, 70vw); }
      .hero { padding: 52px 20px 44px; }
    }
  </style>
</head>

function detectLang() {
  try { const s = localStorage.getItem('om_lang'); if (s && I18N[s]) return s; } catch (e) {}
  const l = (navigator.language || 'en').toLowerCase();
  if (l.startsWith('zh')) return (l.includes('cn') || l.includes('hans')) ? 'zh-CN' : 'zh-TW';
  if (l.startsWith('ja')) return 'ja';
  if (l.startsWith('ko')) return 'ko';
  return 'en';
}

function setLang(code) {
  const d = I18N[code] || I18N.en;
  document.documentElement.lang = code;
  document.title = d.title;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = d[el.dataset.i18n];
    if (v !== undefined) el.textContent = v;
  });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === code));
  try { localStorage.setItem('om_lang', code); } catch (e) {}
}

document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
setLang(detectLang());
